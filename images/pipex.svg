<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="400" height="220" rx="16" fill="#0d1117"/>
  <!-- parent process -->
  <rect x="30" y="20" width="120" height="70" rx="6" fill="#161b22" stroke="#2bb3b5" stroke-width="3"/>
  <text x="90" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8b949e">parent</text>
  <text x="130" y="78" text-anchor="middle" font-family="monospace" font-size="13" fill="#2bb3b5">fd[1]</text>
  <!-- child process -->
  <rect x="250" y="20" width="120" height="70" rx="6" fill="#161b22" stroke="#2bb3b5" stroke-width="3"/>
  <text x="310" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8b949e">child</text>
  <text x="270" y="78" text-anchor="middle" font-family="monospace" font-size="13" fill="#2bb3b5">fd[0]</text>
  <!-- kernel -->
  <rect x="100" y="110" width="200" height="65" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="110" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8b949e">kernel</text>
  <rect x="170" y="125" width="60" height="35" rx="4" fill="#2bb3b5"/>
  <text x="200" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0d1117">pipe</text>
  <!-- write: parent fd[1] -> pipe -->
  <path d="M130 92 Q130 115 168 130" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="82" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">write</text>
  <!-- read: pipe -> child fd[0] -->
  <path d="M232 140 Q270 125 270 98" fill="none" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">read</text>
  <text x="200" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">PIPEX</text>
</svg>
